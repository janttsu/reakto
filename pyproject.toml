[project]
name = "reakto"
version = "0.1.0"
description = "E-mail triage with a local LLM: lists the mails that still need your personal reaction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["email", "triage", "llm", "ollama", "privacy"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
reakto = "reakto.cli:main"

[project.urls]
Homepage = "https://github.com/janttsu/reakto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
